<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Aketza Gonzalez Rey">
    <meta name="description" content="Pagina para ver la tabla de los equipos de blood bowl disponibles">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../img/logo.PNG" type="image/x-icon">
    <title>BB | Ver Equipos</title>
</head>

<body>
    <!-- HEADER -->
    <header role="banner">
        <h1>Blood Bowl</h1>

        <!-- NAV -->
        <!-- MOVIL/TABLET -->
        <nav class="navbar d-lg-none menu-movil" role="navigation" aria-label="Menú principal móvil">

            <div class="container-fluid">

                <!-- Botón hamburguesa -->
                <button class="navbar-toggler menu-movil__toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuMovil" aria-controls="menuMovil" aria-expanded="false"
                    aria-label="Mostrar u ocultar menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse menu-movil__panel" id="menuMovil">
                    <ul class="navbar-nav mt-2">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html" role="menuitem">Pagina principal</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./crearEquipo.html" role="menuitem">Crear equipo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./formulario.html" role="menuitem">Contacta con nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./enlaces.html" role="menuitem">Enlaces a otras paginas</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
        <!-- ORDENADOR -->
        <nav class="d-none d-lg-block menu" role="navigation" aria-label="Menú principal">
            <div class="menu--etiqueta">
                <a href="../index.html" aria-label="Ir a la página principal">
                    <img src="../img/logo.PNG" alt="Despliega Menu" class="menu--logo">
                </a>
            </div>

            <div class="menu--items" role="menubar">
                <div class="menu--item" role="none">
                    <a href="../index.html" role="menuitem">Pagina principal</a>
                </div>
                <div class="menu--item" role="none">
                    <a href="./crearEquipo.html" role="menuitem">Crear equipo</a>
                </div>
                <div class="menu--item" role="none">
                    <a href="./formulario.html" role="menuitem">Contacta con nosotros</a>
                </div>
                <div class="menu--item" role="none">
                    <a href="./enlaces.html" role="menuitem">Enlaces a otras paginas</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN -->
    <main role="main">
        <section id="contenedorTabla" class="contenedor" role="region" aria-labelledby="titulo-tabla">

            <h2 id="titulo-tabla">Revisa la tabla de los equipos</h2>

            <select name="equipos" id="equipos" aria-label="Selector de equipos disponibles">
            </select>

            <section id="informacionEquipo" role="region" aria-live="polite"
                aria-label="Información del equipo seleccionado">
            </section>

            <button id="btnCrearEquipo" aria-label="Crear un nuevo equipo personalizado">
                Crea tu propio equipo
            </button>
        </section>
    </main>

    <!-- FOOTER -->
    <footer role="contentinfo">
        <p>Aketza González Rey - 2025</p>
    </footer>

    <script type="text/javascript" src="../js/verEquipos.js"></script>
    <script src="../js/bootstrap.bundle.js"></script>
</body>

</html>
